<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>私の好きな音楽</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: sans-serif;
      background-color: #f5f5f5;
      color: #333;
      padding-bottom: 100px;
    }

    /* headerの背景色 */
    header {
      background-color: #00CCCC;
      color: white;
      padding: 20px;
      text-align: center;
    }

    /* mainの文字色 */
    main {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      color: #33CCCC;
    }

    section {
      background-color: white;
      padding: 25px;
      margin-bottom: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h2 {
      color: #33CCCC;
    }

    /* footerの背景色 */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #66CCCC;
      color: white;
      text-align: center;
      padding: 15px;
    }

    footer a {
      color: #ecf0f1;
      margin: 0 10px;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <header>
    <h1>私の好きな音楽</h1>
  </header>

  <main>
    <section>
      <h2>このサイトについて</h2>
      <p>
        私の好きな音楽を紹介するWebサイトです。
      </p>
    </section>

    <section>
      <h2>お知らせ</h2>
      <p>
        最新の情報はこちらに順次掲載します。
      </p>
    </section>
  </main>

  <footer>
    <div>
      お問い合わせ：example@example.com
    </div>

    <div>
      <a href="https://twitter.com/" target="_blank">X</a>
      <a href="https://www.instagram.com/" target="_blank">Instagram</a>
      <a href="https://www.facebook.com/" target="_blank">Facebook</a>
    </div>
  </footer>

</body>
</html>
